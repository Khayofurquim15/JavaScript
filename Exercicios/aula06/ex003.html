<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 3</title>
    
    <style>
        body {
          background-color: rgb(161, 255, 138);
          color: rgb(255, 255, 255);
          font: normal 20pt Arial;
        }
        h1{
            color: rgb(59, 0, 126);
        }
    </style>
</head>
<body>
    <h1>Exercicio 3</h1>
    <script>
        let n1 = Number(window.prompt('Digite um numero: ')) // sem o number ele recebe uma string //
        let n2 = Number(window.prompt('Digite outro numero: ')) // com o number ele recebe um numero //
        let resultado = n1 + n2 
        document.write(`A soma entre ${n1} e ${n2} é igual a ${resultado}<br/>`) // soma os dois numeros dados //
        // (number + number) para adição //
        // (string + string) para concatenação //
    </script>
</body>
</html>
