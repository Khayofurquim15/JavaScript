<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>teste</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            margin: auto;
            border-collapse: collapse;
            margin-top: 60px;
        }

        td, th{
            border: 1px solid black;
            padding: 10px;
            width: 60px;
            text-align: center;
        }
        #cadastro{
            margin: auto;
            padding: 10px;
            width: 300px;
        }

    </style>
</head>
<body>
    <h1 style="text-align: center;" >Teste de DOM com Tabelas</h1>
    <div id="cadastro" >
        <input type="text" id="nome" placeholder="coloque seu nome" >
        <input type="number" id="idade" placeholder="coloque sua idade">
        <input type="text" id="sexo" placeholder="coloque M ou F"> <br>
        <input type="button" id="cadastrar" value="adicionar">
        <input type="button" id="limpar" value="limpar">
    </div>

    <table>
        <thead>
            <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Sexo</th>
            </tr>
        </thead>
        <tbody id="conteudo">

        </tbody>
        
    </table>

    <script src="script.js"></script>
</body>
</html>
